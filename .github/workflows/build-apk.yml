name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
        type: string
      app_name:
        description: 'App name'
        required: true
        type: string
        default: 'MyApp'
      package_name:
        description: 'Package name (e.g. com.rizx.myapp)'
        required: true
        type: string
        default: 'com.rizx.webapp'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (manual)
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # accept licenses non-interactively
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409647d489ab76bceae1ed541060dd321\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451eabf01fb78a37df56f94e904a5\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # install required packages
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || \
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || \
            $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

          # path to build-tools
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_ENV
          ls "$ANDROID_HOME/build-tools/" || true

      - name: Prepare project
        run: |
          set -e
          cp -r template build_src
          cd build_src

          APP_NAME='${{ github.event.inputs.app_name }}'
          PKG='${{ github.event.inputs.package_name }}'
          URL='${{ github.event.inputs.url }}'

          PKG=$(echo "$PKG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.]//g')
          if [ -z "$PKG" ]; then PKG=com.rizx.webapp; fi

          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          if [ -f app/src/main/java/com/webview/app/MainActivity.java ]; then
            mv app/src/main/java/com/webview/app/MainActivity.java "app/src/main/java/$PKG_PATH/MainActivity.java"
            rm -rf app/src/main/java/com/webview
          fi

          sed -i "s/com.webview.app/$PKG/g" "app/src/main/java/$PKG_PATH/MainActivity.java"
          # replace START_URL
          sed -i "s|private static final String START_URL = \".*\";|private static final String START_URL = \"$URL\";|g" "app/src/main/java/$PKG_PATH/MainActivity.java"

          sed -i "s/namespace 'com.webview.app'/namespace '$PKG'/" app/build.gradle
          sed -i "s/applicationId \"com.webview.app\"/applicationId \"$PKG\"/" app/build.gradle
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|" app/src/main/res/values/strings.xml

          echo "Building APP=$APP_NAME PKG=$PKG URL=$URL"
          cat "app/src/main/java/$PKG_PATH/MainActivity.java" | head -20

      - name: Setup Gradle Wrapper
        run: |
          set -e
          cd build_src
          # write wrapper properties + use gradle from apt or download
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROP'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROP
          # install gradle to generate wrapper jar if needed
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ls -la

      - name: Build Release APK
        run: |
          set -e
          cd build_src
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          set -e
          UNSIGNED=$(find build_src/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $UNSIGNED"
          cp "$UNSIGNED" app-release.apk
          ls -lh app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_id }}
          path: app-release.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ github.event.inputs.app_name }} (${{ github.run_id }})"
          body: |
            App: ${{ github.event.inputs.app_name }}
            URL: ${{ github.event.inputs.url }}
            Package: ${{ github.event.inputs.package_name }}
          files: app-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
