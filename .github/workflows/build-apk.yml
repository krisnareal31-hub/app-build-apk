name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        default: "MyApp"
        type: string
      package_name:
        description: "Package name (e.g. com.rizx.app)"
        required: true
        default: "com.rizx.webapp"
        type: string
      icon_url:
        description: "Icon URL (PNG, optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare project
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          PKG_NAME: ${{ inputs.package_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: bash scripts/prepare.sh

      - name: Build Release APK
        working-directory: build_app
        run: |
          gradle assembleRelease --no-daemon
          find . -name "*.apk" -print

      - name: Package APK
        run: |
          APK=$(find build_app -name "*release*.apk" | head -n 1)
          if [ -z "$APK" ]; then APK=$(find build_app -name "*.apk" | head -n 1); fi
          echo "Using $APK"
          cp "$APK" app-release.apk
          ls -lh app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_id }}
          path: app-release.apk
          retention-days: 5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ inputs.app_name }} (${{ github.run_id }})"
          body: |
            **App:** ${{ inputs.app_name }}
            **URL:** ${{ inputs.url }}
            **Package:** ${{ inputs.package_name }}
          files: app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
