name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
        type: string
      app_name:
        description: 'App name'
        required: true
        type: string
        default: 'MyApp'
      package_name:
        description: 'Package name (e.g. com.rizx.myapp)'
        required: true
        type: string
        default: 'com.rizx.webapp'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' "84831b9409647d489ab76bceae1ed541060dd321" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf '%s\n' "d56f5187479451eabf01fb78a37df56f94e904a5" >> "$ANDROID_HOME/licenses/android-sdk-license"

          SDKM=""
          for c in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/tmp/lic.txt 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/build-tools/"

      - name: Prepare project
        run: |
          set -e
          cp -r template build_src
          cd build_src

          APP_NAME='${{ github.event.inputs.app_name }}'
          PKG='${{ github.event.inputs.package_name }}'
          URL='${{ github.event.inputs.url }}'

          PKG=$(echo "$PKG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.]//g')
          [ -z "$PKG" ] && PKG=com.rizx.webapp

          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          if [ -f app/src/main/java/com/webview/app/MainActivity.java ]; then
            mv app/src/main/java/com/webview/app/MainActivity.java "app/src/main/java/$PKG_PATH/MainActivity.java"
            rm -rf app/src/main/java/com/webview
          fi

          sed -i "s/com\.webview\.app/$PKG/g" "app/src/main/java/$PKG_PATH/MainActivity.java"
          python3 - << PY2
          from pathlib import Path
          p = Path("app/src/main/java/$PKG_PATH/MainActivity.java")
          t = p.read_text()
          import re
          t = re.sub(r'private static final String START_URL = ".*?";', 'private static final String START_URL = "$URL";', t)
          p.write_text(t)
          PY2

          sed -i "s/namespace 'com.webview.app'/namespace '$PKG'/" app/build.gradle
          sed -i "s/applicationId \"com.webview.app\"/applicationId \"$PKG\"/" app/build.gradle
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|" app/src/main/res/values/strings.xml
          echo "APP=$APP_NAME PKG=$PKG URL=$URL"

      - name: Setup Gradle Wrapper
        run: |
          set -e
          cd build_src
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Build Release APK
        run: |
          set -e
          cd build_src
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          set -e
          UNSIGNED=$(find build_src/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $UNSIGNED"
          cp "$UNSIGNED" app-release.apk
          ls -lh app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_id }}
          path: app-release.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ github.event.inputs.app_name }} (${{ github.run_id }})"
          body: |
            App: ${{ github.event.inputs.app_name }}
            URL: ${{ github.event.inputs.url }}
            Package: ${{ github.event.inputs.package_name }}
          files: app-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
